name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dateien einsortieren
        run: |
          shopt -s nullglob
          mkdir -p src/main/java/dev/nearestvillager src/main/resources
          for f in *.java; do mv "$f" src/main/java/dev/nearestvillager/; done
          if [ -f fabric.mod.json ]; then mv fabric.mod.json src/main/resources/; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nearest-villager-fabric
          path: build/libs/*.jar
